[project]
name = "roro-yield"
version = "0.1.0"
description = "Ro-Ro deck stowage & dynamic yield optimizer"
requires-python = ">=3.11"
dependencies = [
    "pulp>=3.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "highspy>=1.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "reportlab>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: timing tests (deselect with -m 'not slow')"]
